[package]
name = "ssh-manager"
version = "0.9.0"
description = "Kino SSH Manager - Secure SSH credential manager"
authors = ["Kino SSH Manager contributors"]
license = "GPL-3.0-only"
edition = "2021"
# The crate builds two binaries, so a bare `cargo run` - which is what
# `tauri dev` issues - is ambiguous and fails. The app is the one to run;
# `kino-mcp` is a server you start yourself.
default-run = "ssh-manager"

[lib]
name = "ssh_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kino-mcp"
path = "src/bin/mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
ssh-key = { version = "0.6", features = ["ed25519", "getrandom"] }
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
dirs = "5"
ureq = { version = "2", features = ["json"] }
zeroize = "1"
portable-pty = "0.8.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "time", "process"] }
russh = "0.61"
russh-sftp = "2.3"
log = "0.4"
# TLS must be compiled in or wss:// relay URLs fail with "TLS support not compiled in".
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = "0.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2.3.3"
rmcp = { version = "3", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
# Already in the tree via tauri-utils; a direct dep costs no extra build.
regex = "1"

[dev-dependencies]
tempfile = "3"

# russh pulls pre-release RustCrypto crates (ssh-key/elliptic-curve/p256/…) that
# trip the std `ptr::copy_nonoverlapping` UB-precondition check during the SSH
# handshake. The violations are benign on supported platforms, but the check
# (enabled with debug-assertions) aborts the process on connect. Disable
# debug-assertions for dependencies only - our own crate keeps them on.
[profile.dev.package."*"]
debug-assertions = false
overflow-checks = false
