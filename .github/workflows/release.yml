name: release

# Builds installers for Linux (.deb, .rpm, .AppImage) and Windows (.msi, .exe)
# and attaches them to a single draft GitHub Release. Trigger by pushing a
# version tag (e.g. v0.2.0), or run manually from the Actions tab.
#
# The draft is created once, by its own job, and the build matrix uploads into
# it by id. This is not a tidiness preference - it is the only arrangement that
# works. A draft release has no resolvable tag (`GET /releases/tags/{tag}`
# returns 404 until the release is published), so tauri-action's find-or-create
# can never find an existing draft. Letting both matrix jobs create their own
# produced two drafts every release, each holding half the installers.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the draft
        id: create
        uses: actions/github-script@v7
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.TAG;
            // A re-run of the same tag must not add a second draft, so adopt
            // one that already exists. Drafts can only be found by listing -
            // see the note at the top of this file.
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = releases.data.find((r) => r.tag_name === tag);
            if (existing) {
              core.info(`Reusing release ${existing.id} for ${tag}`);
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Kino SSH Manager ${tag}`,
              body: "See CHANGELOG.md for what changed in this release.",
              draft: true,
              prerelease: false,
            });
            core.info(`Created release ${data.id} for ${tag}`);
            return data.id;

  build:
    name: Build ${{ matrix.platform }}
    needs: create-release
    permissions:
      contents: write
      # Provenance is signed with a short-lived OIDC token rather than a stored
      # secret, so the attestation says which workflow at which commit produced
      # the file - something a signature alone cannot.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Building vendored OpenSSL (Windows) needs NASM; Perl ships on the runner.
      - name: Install NASM (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing keys for the in-app updater. Generate once with
          # `npm run tauri signer generate -- -w ~/.tauri/kino.key` and store the
          # private key + password as repository secrets. Without these the
          # bundler cannot produce the .sig files the updater verifies.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload into the release the first job made, instead of creating one.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          # Publishes the latest.json manifest the updater endpoint points at.
          includeUpdaterJson: true

      # Installers are named with the version in them, which makes a link to
      # "the current Linux build" impossible: every release breaks it. These
      # are copies under fixed names, so the README and the website can point
      # straight at a download that keeps working. The versioned originals
      # stay - they are what the updater's manifest references.
      - name: Publish downloads under fixed names
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          shopt -s nullglob
          stage=$(mktemp -d)
          copy() { [ -e "$1" ] && cp "$1" "$stage/$2" && echo "  $2 <- $(basename "$1")"; }
          b=src-tauri/target/release/bundle
          for f in "$b"/deb/*.deb;             do copy "$f" kino-linux-x86_64.deb; done
          for f in "$b"/rpm/*.rpm;             do copy "$f" kino-linux-x86_64.rpm; done
          for f in "$b"/appimage/*.AppImage;   do copy "$f" kino-linux-x86_64.AppImage; done
          for f in "$b"/msi/*.msi;             do copy "$f" kino-windows-x86_64.msi; done
          for f in "$b"/nsis/*-setup.exe;      do copy "$f" kino-windows-x86_64-setup.exe; done
          ls "$stage" > /dev/null
          echo "STAGE=$stage" >> "$GITHUB_ENV"

      - name: Attach them to the release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = process.env.STAGE;
            const release_id = Number(process.env.RELEASE_ID);
            const { owner, repo } = context.repo;
            const existing = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id, per_page: 100,
            });
            for (const name of fs.readdirSync(dir)) {
              // Re-running a tag replaces rather than fails.
              for (const a of existing.data.filter((a) => a.name === name)) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
              const data = fs.readFileSync(path.join(dir, name));
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id, name, data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
              });
              core.info(`Uploaded ${name} (${data.length} bytes)`);
            }

      # Tauri bundles every [[bin]] in the crate, so kino-mcp lands next to the
      # app in each installer without any config - which is also why it must
      # NOT be declared as a sidecar too: WiX refuses the duplicate file and
      # the MSI fails to link. This check catches the opposite failure, a
      # change that stops it being bundled and leaves the MCP panel pointing
      # at nothing. Windows has no one-liner for an MSI's file table, so the
      # .deb stands in for both.
      - name: Check the .deb carries kino-mcp
        if: runner.os == 'Linux'
        run: |
          # dpkg-deb lists members as `./usr/...` or `usr/...` depending on
          # the version that built the archive; accept both.
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            dpkg-deb -c "$deb" | grep -qE ' (\./)?usr/bin/kino-mcp$' \
              || { echo "::error::$deb does not contain usr/bin/kino-mcp"; exit 1; }
          done

      # Headless servers still need kino-mcp without the desktop app. Release
      # assets share one flat namespace, so the platform stays in the archive
      # name - but the file inside is already called kino-mcp (and on Linux
      # already executable), so there is nothing to rename. Packed from the
      # build tauri-action just bundled, so it is the same binary.
      - name: Package the MCP server
        id: mcp
        shell: bash
        run: |
          stage=$(mktemp -d)
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp src-tauri/target/release/kino-mcp.exe "$stage/kino-mcp.exe"
            name="kino-mcp-windows-x86_64.zip"
            # 7z is a native Windows program; keep bash paths away from it.
            (cd "$stage" && 7z a -tzip out.zip kino-mcp.exe)
            mv "$stage/out.zip" "$name"
          else
            install -m 755 src-tauri/target/release/kino-mcp "$stage/kino-mcp"
            name="kino-mcp-linux-x86_64.tar.gz"
            tar -C "$stage" -czf "$name" kino-mcp
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The installers are signed; the standalone archive is signed with the
      # same key, so a user who trusts one trusts the other.
      - name: Sign the MCP server
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri signer sign "${{ steps.mcp.outputs.name }}"

      - name: Attest what this workflow built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.mcp.outputs.name }}

      - name: Attach it to the release
        uses: actions/github-script@v7
        env:
          ASSET: ${{ steps.mcp.outputs.name }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const name = process.env.ASSET;
            const release_id = Number(process.env.RELEASE_ID);
            const { owner, repo } = context.repo;

            // Re-running a tag would otherwise fail with "already_exists";
            // replace the asset rather than refuse to upload.
            const existing = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id, per_page: 100,
            });
            const names = new Set([name, `${name}.sig`]);
            for (const asset of existing.data.filter((a) => names.has(a.name))) {
              core.info(`Replacing existing asset ${asset.id}`);
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }

            // The signature travels with the binary. A signature published
            // separately, or later, is one nobody checks.
            for (const asset of [name, `${name}.sig`]) {
              const data = fs.readFileSync(asset);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id, name: asset, data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
              });
              core.info(`Uploaded ${asset} (${data.length} bytes)`);
            }

  # One list of everything the release contains, signed once. Per-asset
  # signatures prove each file; this proves the *set* - that no extra asset was
  # slipped in beside them, which per-asset signatures cannot say.
  checksums:
    name: Checksum and sign the release
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Only the CLI is needed, and only for `signer sign`.
      - name: Install the Tauri CLI
        run: npm ci --ignore-scripts

      - name: Collect the published assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          mkdir -p dist && cd dist
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
            --jq '.[] | select(.name | test("SHA256SUMS") | not) | "\(.id)\t\(.name)"' \
            > ../assets.tsv
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" > "$name"
          done < ../assets.tsv
          ls -la

      - name: Write SHA256SUMS
        run: |
          cd dist
          # Sorted, so two runs of the same release produce the same file.
          sha256sum $(ls | sort) > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Sign it
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri signer sign SHA256SUMS

      - name: Attach both to the release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const release_id = Number(process.env.RELEASE_ID);
            const { owner, repo } = context.repo;
            const existing = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id, per_page: 100,
            });
            for (const name of ['SHA256SUMS', 'SHA256SUMS.sig']) {
              for (const a of existing.data.filter((a) => a.name === name)) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
              const data = fs.readFileSync(name);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id, name, data,
                headers: {
                  'content-type': 'text/plain',
                  'content-length': data.length,
                },
              });
              core.info(`Uploaded ${name}`);
            }
